[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-paper-bot"
version = "0.1.0"
description = "Public-data Polymarket paper-trading bot (research / simulation)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Polymarket Paper Bot Contributors" }]
dependencies = [
  "httpx>=0.27,<0.29",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
polymarket-paper-bot = "polymarket_paper_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
